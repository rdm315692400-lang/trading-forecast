<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>תחזית מסחר V12</title>
<style>body{font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff;margin:0;padding:22px}main{max-width:760px;margin:auto}.card{background:#151d33;border-radius:18px;padding:20px;margin:16px 0}input,button{font-size:18px;padding:12px;border-radius:10px;border:0}button{cursor:pointer}pre{white-space:pre-wrap;line-height:1.6}</style></head>
<body><main><h1>תחזית מסחר V12</h1><div class="card">45 מניות מחוברות כרגע. 20 מדדים וסחורות יופעלו רק לאחר חיבור מקור נתונים מאומת.</div>
<div class="card"><input id="s" value="AAPL"><button onclick="go()">בדוק נכס</button><pre id="o"></pre></div></main>
<script>
async function go(){const s=document.getElementById('s').value.trim();const o=document.getElementById('o');o.textContent='טוען...';
try{const r=await fetch('/api/v12/'+encodeURIComponent(s));const j=await r.json();o.textContent=JSON.stringify(j,null,2)}catch(e){o.textContent='שגיאה: '+e}}
</script></body></html>
